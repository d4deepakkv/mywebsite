# Spin up Postgres + the FastAPI backend with one command:
#   docker compose up --build
# Then run the frontend separately with `npm run dev` (see frontend/README),
# or uncomment the frontend service below.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://discovery:discovery@db:5432/discovery
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"

volumes:
  pgdata:
